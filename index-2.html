<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AURA Music</title><style>
:root{--bg:#000;--card:#141714;--tx:#f2f5ee;--mut:#8b9486;--ac:#c6ff3d;--r:18px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;height:100dvh;overflow:hidden}
main{height:100%;overflow:auto;padding:20px 16px 190px}
h1{font-size:30px;margin-bottom:14px}h3{margin:20px 0 8px}
button{background:var(--card);color:var(--tx);border:0;border-radius:var(--r);min-height:48px;min-width:48px;padding:0 16px;font:inherit}
button:active{transform:scale(.95)}button.pri{background:var(--ac);color:#000;font-weight:700}
input[type=text],input[type=password]{width:100%;min-height:50px;border-radius:var(--r);border:1px solid #2a2f28;background:var(--card);color:var(--tx);padding:0 16px;font:inherit}
.row{display:flex;align-items:center;gap:12px;padding:8px;border-radius:var(--r);min-height:64px}
.row:active{background:var(--card)}.row .meta{flex:1;min-width:0}
.meta b,.meta small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}small{color:var(--mut)}
.art{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--ac),#1c3a0e);flex:none;background-size:cover}
.art.big{width:min(78vw,340px);height:min(78vw,340px);border-radius:24px;margin:20px auto}
.tag{color:#000;background:var(--ac);border-radius:8px;font-size:11px;padding:1px 6px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg);border-top:1px solid #1d221b;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border-radius:0;background:none;color:var(--mut);min-height:60px}nav .on{color:var(--ac)}
#mini{position:fixed;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--r);padding:8px}
#mini .meta{flex:1;min-width:0}#mini button{background:none}
#full{position:fixed;inset:0;background:var(--bg);padding:16px;overflow:auto;text-align:center;z-index:5}
#full h2{margin-top:6px}#full p{color:var(--mut)}#full input[type=range]{width:100%;accent-color:var(--ac);margin:14px 0}
.times{display:flex;justify-content:space-between;color:var(--mut)}.ctl{display:flex;justify-content:center;gap:12px;margin:12px 0}
.ctl .main{background:var(--ac);color:#000;width:72px;height:72px;border-radius:50%;font-size:26px}.close{float:left}
.on-act{outline:2px solid var(--ac)}#queueList{text-align:left}
#toast{position:fixed;top:16px;left:16px;right:16px;background:var(--ac);color:#000;padding:12px;border-radius:var(--r);opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.show{opacity:1}[hidden]{display:none!important}
#gate{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:28px}#gate p{color:var(--mut)}
#lyr{max-height:34vh;overflow:auto;text-align:center;margin:8px 0}.ll{padding:10px;color:var(--mut);font-size:19px;min-height:44px}.ll.cur{color:var(--ac);font-weight:700;font-size:22px}
[data-theme=dark]{--bg:#121412;--card:#1e221d}
[data-theme=light]{--bg:#f6f8f3;--card:#e6eadf;--tx:#10140e;--mut:#4f5a4a;--ac:#3a7d00}
[data-theme=light] #gate{background:var(--bg)}[data-theme=light] .pri,[data-theme=light] .ctl .main,[data-theme=light] #toast{color:#fff}
body.perf *{transition:none!important;animation:none!important;backdrop-filter:none!important}
input[type=range]{width:100%;accent-color:var(--ac);margin:8px 0}label{display:block}
.sk{height:64px;border-radius:18px;margin:8px 0;background:linear-gradient(90deg,var(--card),#262c24,var(--card));background-size:200% 100%;animation:sk 1.2s infinite}@keyframes sk{to{background-position:-200% 0}}
#full.karaoke #fArt,#full.karaoke #dna,#full.karaoke #rel,#full.karaoke #queueList,#full.karaoke #fTitle{display:none}
#full.karaoke #lyr{max-height:58vh}#full.karaoke .ll{font-size:26px}#full.karaoke .ll.cur{font-size:34px}
@media(min-width:700px){main{max-width:760px;margin:0 auto}#mini{max-width:744px;left:0;right:0;margin:0 auto}#full>*{max-width:520px;margin-left:auto;margin-right:auto}#full .ctl,#full .times{max-width:520px}}

</style></head>
<body>
<main id="view"></main>
<div id="mini" hidden><div class="art" id="mArt"></div><div class="meta" id="mMeta"></div>
<button id="mPlay" aria-label="Reproducir o pausar">▶</button><button id="mNext" aria-label="Siguiente">⏭</button></div>
<section id="full" hidden>
<button id="fClose" class="close" aria-label="Cerrar">⌄</button>
<div class="art big" id="fArt"></div><h2 id="fTitle"></h2><p id="fArtist"></p>
<input type="range" id="seek" min="0" max="1000" value="0" aria-label="Progreso">
<div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
<div class="ctl"><button id="bShuf" aria-label="Aleatorio">🔀</button><button id="bPrev" aria-label="Anterior">⏮</button>
<button id="bPlay" class="main" aria-label="Reproducir o pausar">▶</button><button id="bNext" aria-label="Siguiente">⏭</button>
<button id="bRep" aria-label="Repetir">🔁</button></div>

<nav><button data-t="home" class="on">Inicio</button><button data-t="search">Buscar</button><button data-t="lib">Biblioteca</button></nav>
<div id="toast" role="status"></div>
<input type="file" id="dataPicker" accept=".zip,.json" hidden>
<input type="file" id="lrcPicker" hidden>
<input type="file" id="picker" accept="audio/*" multiple hidden>
<script>
'use strict';
/* AURA Music — local-first. Datos en IndexedDB, nada sale del dispositivo. */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => isFinite(s) ? Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0') : '0:00';
const toast = m => { const t = $('toast'); t.textContent = m; t.className = 'show'; setTimeout(() => t.className = '', 2500); };

/* ---------- Almacenamiento (IndexedDB) ---------- */
const DB = {
  db: null,
  open() {
    return new Promise((ok, no) => {
      const r = indexedDB.open('aura', 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('tracks', { keyPath: 'id' }); r.result.createObjectStore('kv'); };
      r.onsuccess = () => { this.db = r.result; ok(); };
      r.onerror = () => no(r.error);
    });
  },
  tx(store, mode, fn) {
    return new Promise((ok, no) => {
      const t = this.db.transaction(store, mode), res = fn(t.objectStore(store));
      t.oncomplete = () => ok(res.result); t.onerror = () => no(t.error);
    });
  },
  all: () => DB.tx('tracks', 'readonly', s => s.getAll()),
  put: t => DB.tx('tracks', 'readwrite', s => s.put(t)),
  del: id => DB.tx('tracks', 'readwrite', s => s.delete(id)),
  get: k => DB.tx('kv', 'readonly', s => s.get(k)),
  set: (k, v) => DB.tx('kv', 'readwrite', s => s.put(v, k)),
};

/* ---------- Búsqueda difusa ---------- */
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9 ]/g, ' ').trim();
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}
function tokenScore(q, w) {
  if (w.startsWith(q)) return 1;
  if (w.includes(q) && q.length > 2) return .8;
  const l = lev(q, w.slice(0, q.length + 1)), tol = q.length > 4 ? 2 : 1;
  return q.length > 1 && l <= tol ? .7 - l * .1 : 0;
}
function score(track, query) {
  const qs = norm(query).split(/\s+/).filter(Boolean);
  const fields = [[norm(track.title), 1.2], [norm(track.artist), 1], [norm(track.album), .6]];
  let total = 0;
  for (const q of qs) {
    let best = 0;
    for (const [f, wt] of fields) for (const w of f.split(' ')) best = Math.max(best, tokenScore(q, w) * wt);
    if (!best) return 0;
    total += best;
  }
  return total / qs.length;
}
const search = (list, q) => list.map(t => [t, score(t, q)]).filter(x => x[1] > .3).sort((a, b) => b[1] - a[1]).map(x => x[0]);

/* ---------- Estado ---------- */
const S = { tracks: [], favs: new Set(), history: [], playlists: [], profile: null, web: [], jamendoId: '', queue: [], idx: -1, shuffle: false, repeat: 0, tab: 'home', url: null, vol: 1, trend: null, plOpen: null, stats: { secs: 0, skips: {} },
  cfg: { theme: 'amoled', perf: false, saver: 0, fade: 0, eq: 'flat', eqGains: [0, 0, 0, 0, 0], smart: true, hide: [] } };
const VERSION = '0.2.0';
const A = [new Audio(), new Audio()]; let audio = A[0], lastT = 0; // A[1] pasa por el ecualizador (solo archivos locales)
const applyVol = () => A.forEach(e => { e.volume = S.vol; });
const saveCfg = () => DB.set('cfg', S.cfg).catch(() => {});
const saveStats = () => DB.set('stats', S.stats).catch(() => {});
const EQ = { bands: [60, 230, 910, 3600, 14000], nodes: null, ctx: null,
  presets: { Flat: [0, 0, 0, 0, 0], Bass: [6, 4, 0, -1, -2], Vocal: [-2, 0, 4, 3, 0], Rock: [4, 2, -1, 2, 4], Pop: [-1, 2, 4, 2, -1], Classical: [3, 2, -1, 2, 3] } };
function initEq() {
  if (EQ.nodes) return EQ.ctx.resume().catch(() => {});
  try {
    const c = new (window.AudioContext || window.webkitAudioContext)(); let prev = c.createMediaElementSource(A[1]);
    EQ.nodes = EQ.bands.map(f => { const n = c.createBiquadFilter(); n.type = 'peaking'; n.frequency.value = f; n.Q.value = 1; prev.connect(n); prev = n; return n; });
    prev.connect(c.destination); EQ.ctx = c; applyEq();
  } catch { toast('El ecualizador no está disponible en este dispositivo.'); }
}
const applyEq = () => EQ.nodes?.forEach((n, i) => { n.gain.value = S.cfg.eqGains[i] || 0; });
function applyCfg() {
  const th = S.cfg.theme === 'auto' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'amoled') : S.cfg.theme;
  document.documentElement.dataset.theme = th; document.body.classList.toggle('perf', !!S.cfg.perf || S.cfg.saver === 2);
}
function fadeVol() { // fundido de entrada/salida entre canciones (0–12 s)
  const f = S.cfg.fade; if (!f || !audio.duration) return;
  audio.volume = S.vol * Math.max(0.05, Math.min(1, audio.currentTime / f, (audio.duration - audio.currentTime) / f));
}
const byId = id => S.tracks.find(t => t.id === id) || S.web.find(t => t.id === id);
const playable = t => !!(t && (t.blob || t.stream));
const https = u => typeof u === 'string' && u.startsWith('https://') ? u : null;
const coverCache = new WeakMap();
const coverUrl = t => t.coverBlob ? (coverCache.get(t.coverBlob) || (coverCache.set(t.coverBlob, URL.createObjectURL(t.coverBlob)), coverCache.get(t.coverBlob))) : (S.cfg.saver ? null : https(t.cover));
const similar = (a, b) => (norm(a.artist) === norm(b.artist) ? 3 : 0) + (a.album && a.album === b.album && a.album !== 'Local' ? 2 : 0) + (a.genre && norm(a.genre) === norm(b.genre) ? 2 : 0)
  + (a.year && b.year && Math.abs(a.year - b.year) <= 3 ? 1 : 0) + (a.bpm && b.bpm && Math.abs(a.bpm - b.bpm) <= 12 ? 1 : 0);
function recommend(seed, n = 20) { // similitud local + favoritos + frecuencia − saltos; nada sale del dispositivo
  const hr = new Map(), hh = new Map(), nowH = new Date().getHours();
  S.history.forEach(h => { hr.set(h.id, (hr.get(h.id) || 0) + 1); const d = Math.abs(new Date(h.at).getHours() - nowH); if (Math.min(d, 24 - d) <= 2) hh.set(h.id, (hh.get(h.id) || 0) + 1); });
  return S.tracks.filter(t => t.id !== seed.id && playable(t)).map(t => [t, similar(seed, t) + (S.favs.has(t.id) ? 1 : 0) + Math.min(2, Math.log2(1 + (hr.get(t.id) || 0))) + Math.min(1, (hh.get(t.id) || 0) * 0.5) - Math.min(2, (S.stats.skips[t.id] || 0) * 0.5)])
    .filter(x => x[1] > 0.5).sort((a, b) => b[1] - a[1]).slice(0, n).map(x => x[0]);
}
function smartAppend() {
  const t = cur(); if (!t) return false;
  const ids = recommend(t, 10).map(x => x.id).filter(id => !S.queue.includes(id)); S.queue.push(...ids); return ids.length > 0;
}
const dataCache = new WeakMap();
function nativeCover(t) { // la notificación nativa recibe la portada como data: (local) o URL https
  if (t.coverBlob) {
    if (dataCache.has(t.coverBlob)) return dataCache.get(t.coverBlob);
    dataCache.set(t.coverBlob, '');
    if (typeof createImageBitmap === 'function') createImageBitmap(t.coverBlob).then(bm => {
      const c = document.createElement('canvas'); c.width = c.height = 256; c.getContext('2d').drawImage(bm, 0, 0, 256, 256);
      dataCache.set(t.coverBlob, c.toDataURL('image/jpeg', .8)); if (cur() === t) notifyNative();
    }).catch(() => {});
    return '';
  }
  return S.cfg.saver ? '' : https(t.cover) || '';
}
function notifyNative() { const t = cur(); try { if (t) window.AuraNative?.state(t.title, t.artist, !audio.paused, nativeCover(t)); } catch { /* sin puente nativo */ } }
const cur = () => byId(S.queue[S.idx]);

/* ---------- Fuentes de Internet (MusicSource): solo catálogos que permiten streaming ---------- */
const audiusTrack = x => ({ id: 'a_' + x.id, title: x.title, artist: x.user?.name, album: 'Audius', source: 'audius', blob: null, plays: 0,
  cover: x.artwork?.['480x480'] || x.artwork?.['150x150'], stream: `https://api.audius.co/v1/tracks/${encodeURIComponent(x.id)}/stream?app_name=AURA` });
async function loadTrending() { // descubrimiento: tendencias abiertas de Audius
  if (!$('trend')) return;
  try {
    if (!S.trend) {
      const r = await fetch('https://api.audius.co/v1/tracks/trending?limit=15&app_name=AURA'); if (!r.ok) throw new Error('trend');
      S.trend = ((await r.json()).data || []).filter(x => x.is_streamable !== false).map(audiusTrack).filter(t => t.title && t.artist);
    }
    S.web = S.trend; if ($('trend')) $('trend').innerHTML = S.trend.map(t => row(t)).join('') || '<small>Sin tendencias ahora.</small>';
  } catch { if ($('trend')) $('trend').innerHTML = '<small>Sin conexión: no se pueden cargar las tendencias.</small>'; }
}
const SOURCES = {
  audius: { // Audius: plataforma abierta de artistas independientes, API gratuita
    async search(q) {
      const r = await fetch('https://api.audius.co/v1/tracks/search?limit=15&app_name=AURA&query=' + encodeURIComponent(q));
      if (!r.ok) throw new Error('audius');
      return ((await r.json()).data || []).filter(x => x.is_streamable !== false).map(audiusTrack);
    } },
  radio: { // Radio en vivo: directorio abierto radio-browser.info (solo emisoras https)
    async search(q) {
      for (const base of ['https://de1.api.radio-browser.info', 'https://nl1.api.radio-browser.info', 'https://at1.api.radio-browser.info']) {
        try {
          const r = await fetch(`${base}/json/stations/search?name=${encodeURIComponent(q)}&hidebroken=true&limit=10&order=votes&reverse=true`);
          if (!r.ok) continue;
          return (await r.json()).filter(s => s.name && https(s.url_resolved)).map(s => ({ id: 'r_' + s.stationuuid, title: s.name.trim(), artist: 'Radio en vivo' + (s.country ? ' · ' + s.country : ''),
            album: (s.tags || '').split(',')[0] || 'Radio', source: 'radio', live: true, blob: null, plays: 0, cover: s.favicon, stream: s.url_resolved }));
        } catch { /* probar el siguiente servidor */ }
      }
      throw new Error('radio');
    } },
  jamendo: { // Jamendo: música Creative Commons; requiere un client_id gratuito
    async search(q) {
      if (!S.jamendoId) return [];
      const r = await fetch(`https://api.jamendo.com/v3.0/tracks/?format=json&limit=15&audioformat=mp32&include=musicinfo&search=${encodeURIComponent(q)}&client_id=${encodeURIComponent(S.jamendoId)}`);
      if (!r.ok) throw new Error('jamendo');
      return ((await r.json()).results || []).map(x => { const mi = x.musicinfo || {};
        return { id: 'j_' + x.id, title: x.name, artist: x.artist_name, album: x.album_name || 'Jamendo', source: 'jamendo', blob: null, plays: 0, cover: x.image, stream: x.audio,
          dlOk: x.audiodownload_allowed === true, dlUrl: x.audiodownload, genre: mi.tags?.genres?.[0], acoustic: mi.acousticelectric, voice: mi.vocalinstrumental, speed: mi.speed }; });
    } },
};
async function webSearch(q) {
  const out = []; let ok = false;
  (await Promise.allSettled(Object.values(SOURCES).map(s => s.search(q)))).forEach(r => { if (r.status === 'fulfilled') { out.push(...r.value); ok = true; } });
  const box = $('webres'); if (!box || $('q').value.trim() !== q) return;
  S.web = out.filter(t => t.title && t.artist && https(t.stream)).map(t => [t, score(t, q)]).sort((a, b) => b[1] - a[1]).map(x => x[0]);
  box.innerHTML = '<h3>En Internet</h3>' + (S.web.map(t => row(t)).join('') || `<small>${ok ? 'Sin resultados en Internet.' : 'Sin conexión o la fuente no responde.'}</small>`);
}
const save = () => Promise.all([DB.set('favs', [...S.favs]), DB.set('history', S.history.slice(-500)), DB.set('playlists', S.playlists)]);

/* ---------- Importación ---------- */
function parseName(name) {
  const base = name.replace(/\.[^.]+$/, '').replace(/_/g, ' ');
  const m = base.split(/\s+-\s+/);
  return m.length > 1 ? { artist: m[0].trim(), title: m.slice(1).join(' - ').trim() } : { artist: 'Artista desconocido', title: base.trim() };
}
async function id3(f) { // lee título, artista, álbum y portada de MP3 con ID3v2.3/2.4
  const out = {};
  try {
    const b = new Uint8Array(await f.slice(0, 2e6).arrayBuffer());
    if (b[0] !== 0x49 || b[1] !== 0x44 || b[2] !== 0x33 || b[3] < 3) return out;
    const end = Math.min(10 + ((b[6] << 21) | (b[7] << 14) | (b[8] << 7) | b[9]), b.length), v = new DataView(b.buffer);
    const txt = (x, enc = x[0]) => new TextDecoder(['iso-8859-1', 'utf-16le', 'utf-16be', 'utf-8'][enc] || 'utf-8').decode(x.subarray(1)).replace(/\0/g, '').trim();
    for (let p = 10; p + 10 < end && b[p];) {
      const id = String.fromCharCode(...b.subarray(p, p + 4)), fs = b[3] === 4 ? (b[p+4] << 21) | (b[p+5] << 14) | (b[p+6] << 7) | b[p+7] : v.getUint32(p + 4);
      const body = b.subarray(p + 10, p + 10 + fs); if (p + 10 + fs > b.length) break; p += 10 + fs;
      if (id === 'TIT2') out.title = txt(body); else if (id === 'TPE1') out.artist = txt(body); else if (id === 'TALB') out.album = txt(body);
      else if (id === 'TCON') out.genre = txt(body).replace(/^\(\d+\)/, '') || undefined; else if (id === 'TKEY') out.key = txt(body);
      else if (id === 'TDRC' || id === 'TYER') out.year = parseInt(txt(body).slice(0, 4)) || undefined; else if (id === 'TBPM') out.bpm = Math.round(parseFloat(txt(body))) || undefined;
      else if (id === 'APIC' && !out.cover) {
        let i = 1; while (body[i]) i++; const mime = String.fromCharCode(...body.subarray(1, i)); i += 2;
        if (body[0] === 1 || body[0] === 2) { while (i + 1 < body.length && (body[i] || body[i + 1])) i += 2; i += 2; } else { while (body[i]) i++; i++; }
        const type = /^image\/(jpeg|png|webp)$/.test(mime) ? mime : 'image/jpeg';
        if (i < body.length) out.cover = new Blob([body.slice(i)], { type });
      }
    }
  } catch { /* sin etiquetas: se usa el nombre del archivo */ }
  return out;
}
async function importFiles(files) {
  let n = 0;
  for (const f of files) {
    if (!f.type.startsWith('audio/') && !/\.(mp3|m4a|aac|flac|wav|ogg|opus)$/i.test(f.name)) { toast('Formato no compatible: ' + f.name); continue; }
    const nm = parseName(f.name), tag = f.type === 'audio/mpeg' || /\.mp3$/i.test(f.name) ? await id3(f) : {};
    const artist = tag.artist || nm.artist, title = tag.title || nm.title, key = trackKey({ artist, title });
    const ex = S.tracks.find(x => !x.blob && trackKey(x) === key);

};

/* ---------- Importar datos de Spotify / backup AURA ---------- */
const trackKey = t => norm(t.artist) + '|' + norm(t.title);
async function readZip(f) { // lee solo los .json relevantes del ZIP, sin cargarlo entero
  const out = [], tail = new DataView(await f.slice(Math.max(0, f.size - 65557)).arrayBuffer());
  let e = tail.byteLength - 22; while (e >= 0 && tail.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('zip');
  const n = tail.getUint16(e + 10, true), cdSize = tail.getUint32(e + 12, true), cdOff = tail.getUint32(e + 16, true);
  const cd = new DataView(await f.slice(cdOff, cdOff + cdSize).arrayBuffer()); let p = 0;
  for (let i = 0; i < n; i++) {
    const m = cd.getUint16(p + 10, true), cs = cd.getUint32(p + 20, true), nl = cd.getUint16(p + 28, true), xl = cd.getUint16(p + 30, true), cl = cd.getUint16(p + 32, true), off = cd.getUint32(p + 42, true);
    const name = new TextDecoder().decode(new Uint8Array(cd.buffer, p + 46, nl)); p += 46 + nl + xl + cl;
    if (!/(Playlist|YourLibrary|StreamingHistory|Streaming_History_Audio)[^/]*\.json$/i.test(name)) continue;
    const lh = new DataView(await f.slice(off, off + 30).arrayBuffer()), start = off + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
    let blob = f.slice(start, start + cs);
    if (m === 8) blob = await new Response(blob.stream().pipeThrough(new DecompressionStream('deflate-raw'))).blob();
    out.push({ name, data: JSON.parse(await blob.text()) });
  }
  return out;
}
async function importData(files) {
  const docs = [];
  try { for (const f of files) { if (/\.zip$/i.test(f.name)) docs.push(...await readZip(f)); else docs.push({ name: f.name, data: JSON.parse(await f.text()) }); } }
  catch { return toast('No pude leer ese archivo. Elige el ZIP de Spotify o sus archivos .json.'); }
  const have = new Map(S.tracks.map(t => [trackKey(t), t])), fresh = new Set(), r = { pl: 0, fav: 0, hist: 0, tr: 0 };
  const ident = (title, artist, album) => {
    if (!title || !artist) return null;
    const k = trackKey({ title, artist }); let t = have.get(k);
    if (!t) { t = { id: 's_' + k, title: String(title), artist: String(artist), album: String(album || 'Sin álbum'), blob: null, source: 'spotify', added: Date.now(), plays: 0 }; have.set(k, t); S.tracks.push(t); fresh.add(t); r.tr++; }
    return t.id;
  };
  const hist = [];
  for (const { data: d } of docs) {
    if (Array.isArray(d)) for (const x of d) hist.push({ title: x.trackName || x.master_metadata_track_name, artist: x.artistName || x.master_metadata_album_artist_name, album: x.master_metadata_album_album_name, at: Date.parse(x.endTime || x.ts) || 0 });
    else if (Array.isArray(d.playlists)) for (const p of d.playlists) { S.playlists.push({ id: 'p_' + Date.now() + '_' + r.pl++, name: String(p.name || 'Playlist'), ids: (p.items || []).map(i => i.track && ident(i.track.trackName, i.track.artistName, i.track.albumName)).filter(Boolean) }); }
    else if (Array.isArray(d.tracks) && d.tracks[0]?.track !== undefined && d.tracks[0]?.artist !== undefined) for (const x of d.tracks) { const id = ident(x.track, x.artist, x.album); if (id) { S.favs.add(id); r.fav++; } }
    else if (d.favs && d.playlists === undefined) { /* formato desconocido */ }
  }
  for (const { data: d } of docs) if (d.favs && d.tracks && !Array.isArray(d.tracks[0])) { // backup AURA
    const map = new Map(d.tracks.map(t => [t.id, ident(t.title, t.artist, t.album) || t.id]));
    d.favs.forEach(id => S.favs.add(map.get(id) || id)); r.fav += d.favs.length;
    (d.playlists || []).forEach(p => { S.playlists.push({ id: 'p_' + Date.now() + '_' + r.pl++, name: p.name, ids: p.ids.map(i => map.get(i) || i) }); });
    S.history.push(...(d.history || []).map(h => ({ ...h, id: map.get(h.id) || h.id })));
  }
  const cnt = new Map(); hist.forEach(h => { const k = trackKey(h); cnt.set(k, (cnt.get(k) || 0) + 1); });
  const top = new Set([...cnt].sort((a, b) => b[1] - a[1]).slice(0, 300).map(x => x[0]));
  for (const h of hist) if (top.has(trackKey(h))) { const id = ident(h.title, h.artist, h.album); S.history.push({ id, at: h.at }); have.get(trackKey(h)).plays++; fresh.add(have.get(trackKey(h))); r.hist++; }
  S.history.sort((a, b) => a.at - b.at);
  try { for (const t of fresh) await DB.put(t); await save(); } catch { return toast('No se pudo guardar. ¿Almacenamiento lleno?'); }
  toast(`Importado: ${r.pl} playlists, ${r.fav} me gusta, ${r.tr} canciones nuevas, ${r.hist} reproducciones`); render();
}
$('dataPicker').onchange = e => { importData([...e.target.files]); e.target.value = ''; };

/* ---------- Cuenta local ---------- */
async function hash(s) {
  try { return [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('aura:' + s)))].map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch { return 'b:' + btoa(s); }
}
function gateUI(html) { let g = $('gate'); if (!g) { g = document.createElement('div'); g.id = 'gate'; document.body.appendChild(g); } g.hidden = false; g.innerHTML = html; return g; }
function setup() {
  const g = gateUI('<h1>Crea tu cuenta</h1><p>Vive solo en este teléfono. No se envía nada a Internet.</p><input type="text" id="gn" placeholder="Tu nombre" maxlength="30"><input type="password" id="gp" placeholder="PIN opcional (4 a 8 números)" inputmode="numeric" maxlength="8"><button class="pri" id="go">Crear cuenta</button>');
  $('go').onclick = async () => {

    if (!name) return toast('Escribe tu nombre.');
    if (pin && !/^\d{4,8}$/.test(pin)) return toast('El PIN debe tener de 4 a 8 números.');
    S.profile = { name, pin: pin ? await hash(pin) : null, created: Date.now() };
    await DB.set('profile', S.profile); g.hidden = true; render();
  };
}

}

(async () => {
